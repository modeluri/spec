name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      # Validates registry.json, incompatible.json, the SPEC examples and the LiteLLM aliases.
      - run: node --test cli/
      # The generated files must match a rebuild from the committed snapshot.
      - run: |
          node tools/build-registry.mjs
          node cli/model-uri.mjs aliases --format litellm > aliases/litellm.yaml
          git diff --exit-code -- registry.json incompatible.json aliases/litellm.yaml
